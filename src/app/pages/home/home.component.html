<main class="home">
  <h1>クイズミュージアム</h1>
  <p class="lead">クイズの館へようこそ。ここから冒険が始まります(準備中)。</p>

  <p class="api-status" [class]="'api-status ' + api().status">
    @switch (api().status) {
      @case ('checking') { API を確認しています... }
      @case ('ok') { API につながっています(環境: {{ environmentName() }}) }
      @case ('error') { API につながりません。API を起動しているか確認してください。 }
    }
  </p>
</main>
